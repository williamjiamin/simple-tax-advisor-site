<svg xmlns="http://www.w3.org/2000/svg" width="12in" height="8in" viewBox="0 0 1200 800" role="img">
<title>Authority is a research map</title>
<desc>Read each lane together. Connections show research flow, not a universal legal ranking.</desc>
<rect width="1200" height="800" fill="white"/>
<text x="55" y="55" font-family="sans-serif" font-size="31" fill="#172c3e">Authority is a research map</text>
<text x="55" y="91" font-family="sans-serif" font-size="18" fill="#21384a">Read each lane together. Connections show research flow, not a universal legal ranking.</text>
<rect x="375" y="120" width="450" height="78" rx="10" fill="#f1f5f7" stroke="#172c3e" stroke-width="2"/>
<text x="393" y="149" font-family="sans-serif" font-size="20" fill="#172c3e">Define the question</text>
<text x="393" y="175" font-family="sans-serif" font-size="17" fill="#21384a">Issue  /  period  /  material facts  /  forum</text>
<line x1="600" y1="198" x2="600" y2="216" stroke="#8b9ba7" stroke-width="2"/>
<line x1="225" y1="216" x2="975" y2="216" stroke="#8b9ba7" stroke-width="2"/>
<line x1="225" y1="216" x2="225" y2="242" stroke="#8b9ba7" stroke-width="2"/>
<line x1="600" y1="216" x2="600" y2="242" stroke="#8b9ba7" stroke-width="2"/>
<line x1="975" y1="216" x2="975" y2="242" stroke="#8b9ba7" stroke-width="2"/>
<rect x="55" y="242" width="340" height="100" rx="10" fill="#f1f5f7" stroke="#137b76" stroke-width="2"/>
<text x="73" y="271" font-family="sans-serif" font-size="20" fill="#137b76">Statutory and regulatory</text>
<text x="73" y="297" font-family="sans-serif" font-size="16" fill="#21384a">Internal Revenue Code</text>
<text x="73" y="320" font-family="sans-serif" font-size="16" fill="#21384a">Applicability, exceptions, amendments</text>
<rect x="430" y="242" width="340" height="100" rx="10" fill="#f1f5f7" stroke="#172c3e" stroke-width="2"/>
<text x="448" y="271" font-family="sans-serif" font-size="20" fill="#172c3e">Judicial interpretation</text>
<text x="448" y="297" font-family="sans-serif" font-size="17" fill="#21384a">Highest court and appellate holdings</text>
<text x="448" y="320" font-family="sans-serif" font-size="17" fill="#21384a">Forum, review route, later treatment</text>
<rect x="805" y="242" width="340" height="100" rx="10" fill="#f1f5f7" stroke="#a66b1e" stroke-width="2"/>
<text x="823" y="271" font-family="sans-serif" font-size="20" fill="#a66b1e">Administrative materials</text>
<text x="823" y="297" font-family="sans-serif" font-size="17" fill="#21384a">Published rulings and procedures</text>
<text x="823" y="320" font-family="sans-serif" font-size="17" fill="#21384a">Scope, conditions, current status</text>
<line x1="225" y1="342" x2="225" y2="374" stroke="#8b9ba7" stroke-width="2"/>
<line x1="600" y1="342" x2="600" y2="374" stroke="#8b9ba7" stroke-width="2"/>
<line x1="975" y1="342" x2="975" y2="374" stroke="#8b9ba7" stroke-width="2"/>
<rect x="55" y="374" width="340" height="100" rx="10" fill="#f1f5f7" stroke="#137b76" stroke-width="2"/>
<text x="73" y="403" font-family="sans-serif" font-size="20" fill="#137b76">Treasury regulations</text>
<text x="73" y="429" font-family="sans-serif" font-size="17" fill="#21384a">Final / temporary / proposed</text>
<text x="73" y="452" font-family="sans-serif" font-size="17" fill="#21384a">Validity, effective dates, expiration</text>
<rect x="430" y="374" width="340" height="100" rx="10" fill="#f1f5f7" stroke="#172c3e" stroke-width="2"/>
<text x="448" y="403" font-family="sans-serif" font-size="20" fill="#172c3e">Tax Court decisions</text>
<text x="448" y="429" font-family="sans-serif" font-size="16" fill="#21384a">Regular / memorandum / summary</text>
<text x="448" y="452" font-family="sans-serif" font-size="16" fill="#21384a">Small-case decisions are not precedent</text>
<rect x="805" y="374" width="340" height="100" rx="10" fill="#f1f5f7" stroke="#a66b1e" stroke-width="2"/>
<text x="823" y="403" font-family="sans-serif" font-size="20" fill="#a66b1e">Private advice</text>
<text x="823" y="429" font-family="sans-serif" font-size="16" fill="#21384a">Private rulings / technical advice</text>
<text x="823" y="452" font-family="sans-serif" font-size="16" fill="#21384a">Recipient-specific; not general precedent</text>
<line x1="225" y1="474" x2="225" y2="508" stroke="#8b9ba7" stroke-width="2"/>
<line x1="600" y1="474" x2="600" y2="508" stroke="#8b9ba7" stroke-width="2"/>
<line x1="975" y1="474" x2="975" y2="508" stroke="#8b9ba7" stroke-width="2"/>
<rect x="55" y="508" width="340" height="100" rx="10" fill="#f1f5f7" stroke="#137b76" stroke-width="2"/>
<text x="73" y="537" font-family="sans-serif" font-size="19" fill="#137b76">Read supporting and adverse law</text>
<text x="73" y="563" font-family="sans-serif" font-size="17" fill="#21384a">Document conflicts rather than hiding</text>
<text x="73" y="586" font-family="sans-serif" font-size="17" fill="#21384a">them in a numerical score.</text>
<rect x="430" y="508" width="340" height="100" rx="10" fill="#f1f5f7" stroke="#172c3e" stroke-width="2"/>
<text x="448" y="537" font-family="sans-serif" font-size="20" fill="#172c3e">Separate penalty analysis</text>
<text x="448" y="563" font-family="sans-serif" font-size="17" fill="#21384a">Relevance, reasoning and source type</text>
<text x="448" y="586" font-family="sans-serif" font-size="17" fill="#21384a">No additive substantial-authority score</text>
<rect x="805" y="508" width="340" height="100" rx="10" fill="#f1f5f7" stroke="#a66b1e" stroke-width="2"/>
<text x="823" y="537" font-family="sans-serif" font-size="20" fill="#a66b1e">IRM and public explanations</text>
<text x="823" y="563" font-family="sans-serif" font-size="17" fill="#21384a">Procedural map; verify underlying law</text>
<text x="823" y="586" font-family="sans-serif" font-size="17" fill="#21384a">Check interim updates and FAQ limits</text>
<text x="55" y="672" font-family="sans-serif" font-size="20" fill="#172c3e">Key distinction: nonprecedential does not mean irrelevant to every separate penalty standard.</text>
<text x="55" y="715" font-family="sans-serif" font-size="17" fill="#21384a">Sources: 26 U.S.C. 6110(k)(3), 7463(b), 7482; 26 CFR 1.6662-4(d).</text>
<text x="55" y="747" font-family="sans-serif" font-size="16" fill="#21384a">Original illustration  |  LIPAI WANG  |  Research checked November 22, 2026</text>
</svg>
